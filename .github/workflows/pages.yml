name: Build & Deploy RegLag

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install markdown

      - name: Build site
        run: |
          python scripts/build.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + pdf-lib
        run: |
          npm init -y
          npm i -D playwright pdf-lib
          npx playwright install --with-deps chromium

      - name: Serve site locally
        run: |
          python3 -m http.server 8000 --directory publish/site &
          sleep 1

      - name: Render PDFs
        run: |
          node scripts/render_pdfs.mjs

      - name: Send email (Postmark)
        env:
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          REGLAG_FROM_EMAIL: ${{ secrets.REGLAG_FROM_EMAIL }}
          REGLAG_REPLY_TO: ${{ secrets.REGLAG_REPLY_TO }}
          EMAIL_SEND_ENABLED: ${{ vars.EMAIL_SEND_ENABLED }}
        run: |
          node scripts/send_postmark_broadcast.mjs

      - name: Commit sent log (idempotency)
        if: ${{ vars.EMAIL_SEND_ENABLED == 'true' }}
        run: |
          if git diff --quiet -- email/sent-log.json; then
            echo "No sent-log changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add email/sent-log.json
          git commit -m "Email: record sent briefing"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
